[project]
name = "synthtwin"
version = "0.1.0"
description = "Can a simulation predict a published catalysis experiment it has not seen?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "numpy", "scipy"]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["synthtwin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
